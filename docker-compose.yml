# Levanta PostgreSQL + API + frontend:  docker compose up --build
# Requiere un archivo .env (copia .env.example).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inventario
      POSTGRES_USER: ${DB_USERNAME:-inventario}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-inventario} -d inventario"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/inventario
      DB_USERNAME: ${DB_USERNAME:-inventario}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env (mínimo 32 caracteres)}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Demo1234!}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
